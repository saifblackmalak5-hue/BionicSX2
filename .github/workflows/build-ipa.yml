name: 🎮 BionicSX2 - Build IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Install Dependencies
        run: |
          brew install cmake ninja ccache

      - name: 🌋 Setup MoltenVK
        run: |
          brew install molten-vk
          echo "MoltenVK installed ✅"

      - name: 🔍 Inspect Full Source Structure
        run: |
          echo "====== ROOT ======"
          ls -la src/armsx2/

          echo "====== CMakeLists Hunt ======"
          find src/armsx2 -name "CMakeLists.txt" 2>/dev/null

          echo "====== cpp folder ======"
          find src/armsx2 -name "*.cpp" | head -10

          echo "====== Android JNI ======"
          find src/armsx2 -name "Android.mk" -o -name "CMakeLists.txt" | head -20

          echo "====== app/src/main/cpp ======"
          ls src/armsx2/app/src/main/cpp/ 2>/dev/null || echo "Not found"


name: 🎮 BionicSX2 - Build IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Install Dependencies
        run: |
          brew install cmake ninja ccache
          echo "Dependencies installed ✅"

      - name: 🌋 Setup MoltenVK
        run: |
          brew install molten-vk
          MOLTENVK_PATH=$(brew --prefix molten-vk)
          echo "MOLTENVK_PATH=$MOLTENVK_PATH" >> $GITHUB_ENV
          echo "MoltenVK installed at $MOLTENVK_PATH ✅"

      - name: ⚙️ Configure CMake for iOS
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path) \
            -DVULKAN_LIBRARY=${{ env.MOLTENVK_PATH }}/lib/libMoltenVK.dylib \
            -DVULKAN_INCLUDE_DIR=${{ env.MOLTENVK_PATH }}/include \
            -S src/armsx2/app/src/main/cpp

      - name: 🔨 Build
        run: |
          cmake --build build --config Release -j$(sysctl -n hw.logicalcpu)

      - name: 📦 Package IPA
        run: |
          mkdir -p output/Payload/BionicSX2.app
          # Copy binary
          cp build/BionicSX2 output/Payload/BionicSX2.app/ 2>/dev/null || \
          find build -name "*.so" -o -name "armsx2" | head -5
          cd output
          zip -r BionicSX2.ipa Payload/
          echo "IPA created ✅"

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BionicSX2-IPA
          path: output/BionicSX2.ipa
          retention-days: 7

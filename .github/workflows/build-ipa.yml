name: 🎮 BionicSX2 - Build IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Install Dependencies
        run: |
          brew install cmake ninja ccache

      - name: 🌋 Setup MoltenVK
        run: |
          brew install molten-vk
          echo "MoltenVK installed ✅"

      - name: 🔍 Inspect Source Structure
        run: |
          echo "=== BionicSX2 Structure ==="
          ls -la
          echo "=== ARMSX2 Source ==="
          ls -la src/armsx2/
          echo "=== CMake files ==="
          find src/armsx2 -name "CMakeLists.txt" | head -20

      - name: ⚙️ Configure CMake for iOS
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -S src/armsx2

      - name: 🔨 Build
        run: |
          cmake --build build --config Release

      - name: 📦 Package IPA
        run: |
          mkdir -p output
          echo "Packaging step - coming soon"

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BionicSX2-IPA
          path: output/*.ipa
          retention-days: 7

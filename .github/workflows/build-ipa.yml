name: 🎮 BionicSX2 - Build IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Install Dependencies
        run: |
          brew install cmake ninja ccache
          echo "Dependencies installed ✅"

      - name: 🌋 Setup MoltenVK
        run: |
          brew install molten-vk
          MOLTENVK_PATH=$(brew --prefix molten-vk)
          echo "MOLTENVK_PATH=$MOLTENVK_PATH" >> $GITHUB_ENV
          echo "MoltenVK installed ✅"

      - name: 🩹 Patch iOS Support in Pcsx2Utils.cmake
        run: |
          FILE="src/armsx2/app/src/main/cpp/cmake/Pcsx2Utils.cmake"
          echo "=== Before patch ==="
          grep -n "Unsupported\|platform\|iOS\|Android\|Linux\|Darwin" $FILE | head -20

          # إضافة iOS كمنصة مدعومة
          sed -i '' \
            's/message(FATAL_ERROR "Unsupported platform.")/message(STATUS "iOS platform - BionicSX2")\n    set(PCSX2_TARGET_TRIPLET "aarch64-apple-ios")\n    set(IOS TRUE)/g' \
            $FILE

          echo "=== After patch ==="
          grep -n "iOS\|Unsupported\|BionicSX2" $FILE | head -20
          echo "Patch applied ✅"

      - name: ⚙️ Configure CMake for iOS
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path) \
            -DVULKAN_LIBRARY=${{ env.MOLTENVK_PATH }}/lib/libMoltenVK.dylib \
            -DVULKAN_INCLUDE_DIR=${{ env.MOLTENVK_PATH }}/include \
            -S src/armsx2/app/src/main/cpp

      - name: 🔨 Build
        run: |
          cmake --build build --config Release -j$(sysctl -n hw.logicalcpu)

      - name: 📦 Package IPA
        run: |
          mkdir -p output/Payload/BionicSX2.app
          find build -type f -perm +111 | head -10
          cd output && zip -r BionicSX2.ipa Payload/
          echo "IPA packaged ✅"

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BionicSX2-IPA
          path: output/BionicSX2.ipa
          retention-days: 7

name: 🎮 BionicSX2 - Build IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Install Dependencies
        run: |
          brew install cmake ninja ccache
          echo "Dependencies installed ✅"

      - name: 🌋 Setup MoltenVK
        run: |
          brew install molten-vk
          MOLTENVK_PATH=$(brew --prefix molten-vk)
          echo "MOLTENVK_PATH=$MOLTENVK_PATH" >> $GITHUB_ENV
          echo "MoltenVK installed ✅"

      - name: 🩹 Patch 1 - iOS Platform Support
        run: |
          FILE="src/armsx2/app/src/main/cpp/cmake/Pcsx2Utils.cmake"
          sed -i '' \
            's/message(FATAL_ERROR "Unsupported platform.")/message(STATUS "iOS platform - BionicSX2")\n    set(PCSX2_TARGET_TRIPLET "aarch64-apple-ios")\n    set(IOS TRUE)/g' \
            $FILE
          echo "Patch 1 applied ✅"

      - name: 🩹 Patch 2 - ARM64 Architecture for iOS
        run: |
          FILE="src/armsx2/app/src/main/cpp/cmake/TargetArch.cmake"
          echo "=== TargetArch.cmake content ==="
          cat $FILE

          # إضافة دعم arm64 لـ iOS
          sed -i '' \
            's/message(FATAL_ERROR "Invalid OS X arch name: ${arch}")/message(STATUS "iOS arm64 arch - BionicSX2")\n        set(arch_name "aarch64")/g' \
            $FILE

          echo "Patch 2 applied ✅"

      - name: ⚙️ Configure CMake for iOS
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path) \
            -DVULKAN_LIBRARY=${{ env.MOLTENVK_PATH }}/lib/libMoltenVK.dylib \
            -DVULKAN_INCLUDE_DIR=${{ env.MOLTENVK_PATH }}/include \
            -S src/armsx2/app/src/main/cpp

      - name: 🔨 Build
        run: |
          cmake --build build --config Release -j$(sysctl -n hw.logicalcpu)

      - name: 📦 Package IPA
        run: |
          mkdir -p output/Payload/BionicSX2.app
          find build -type f -perm +111 | head -10
          cd output && zip -r BionicSX2.ipa Payload/
          echo "IPA packaged ✅"

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BionicSX2-IPA
          path: output/BionicSX2.ipa
          retention-days: 7

name: 🎮 BionicSX2 - Build IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Install Dependencies
        run: |
          brew install cmake ninja ccache curl \
            zlib freetype zstd jpeg-turbo sdl3
          echo "Dependencies installed ✅"

      - name: 🌋 Setup MoltenVK
        run: |
          brew install molten-vk
          MOLTENVK_PATH=$(brew --prefix molten-vk)
          echo "MOLTENVK_PATH=$MOLTENVK_PATH" >> $GITHUB_ENV
          echo "MoltenVK installed ✅"

      - name: 🩹 Patch 1 - iOS Platform Support
        run: |
          FILE="src/armsx2/app/src/main/cpp/cmake/Pcsx2Utils.cmake"
          sed -i '' \
            's/message(FATAL_ERROR "Unsupported platform.")/message(STATUS "iOS platform - BionicSX2")\n    set(PCSX2_TARGET_TRIPLET "aarch64-apple-ios")\n    set(IOS TRUE)/g' \
            $FILE
          echo "Patch 1 ✅"

      - name: 🩹 Patch 2 - Add arm64 to TargetArch.cmake
        run: |
          FILE="src/armsx2/app/src/main/cpp/cmake/TargetArch.cmake"
          sed -i '' \
            's/elseif("${osx_arch}" STREQUAL "ppc64" AND ppc_support)/elseif("${osx_arch}" STREQUAL "arm64")\n\t\t\t\tset(osx_arch_arm64 TRUE)\n\t\t\telseif("${osx_arch}" STREQUAL "ppc64" AND ppc_support)/g' \
            $FILE
          sed -i '' \
            's/if(osx_arch_ppc64)/if(osx_arch_arm64)\n\t\tlist(APPEND ARCH aarch64)\n\t\tendif()\n\n\t\tif(osx_arch_ppc64)/g' \
            $FILE
          echo "Patch 2 ✅"

      - name: 🩹 Patch 3 - Disable PCAP for iOS
        run: |
          FILE="src/armsx2/app/src/main/cpp/cmake/SearchForStuff.cmake"
          sed -i '' \
            's/find_package(PCAP/# iOS: PCAP disabled\n  # find_package(PCAP/g' \
            $FILE
          echo "Patch 3 ✅"

      - name: ⚙️ Configure CMake for iOS
        run: |
          CURL_PATH=$(brew --prefix curl)
          ZLIB_PATH=$(brew --prefix zlib)
          FT_PATH=$(brew --prefix freetype)
          ZSTD_PATH=$(brew --prefix zstd)
          JPEG_PATH=$(brew --prefix jpeg-turbo)
          SDL3_PATH=$(brew --prefix sdl3)

          cmake -B build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path) \
            -DCURL_LIBRARY=$CURL_PATH/lib/libcurl.dylib \
            -DCURL_INCLUDE_DIR=$CURL_PATH/include \
            -DZLIB_LIBRARY=$ZLIB_PATH/lib/libz.dylib \
            -DZLIB_INCLUDE_DIR=$ZLIB_PATH/include \
            -DFREETYPE_LIBRARY=$FT_PATH/lib/libfreetype.dylib \
            -DFREETYPE_INCLUDE_DIRS=$FT_PATH/include/freetype2 \
            -DZstd_LIBRARY=$ZSTD_PATH/lib/libzstd.dylib \
            -DZstd_INCLUDE_DIR=$ZSTD_PATH/include \
            -DJPEG_LIBRARY=$JPEG_PATH/lib/libjpeg.dylib \
            -DJPEG_INCLUDE_DIR=$JPEG_PATH/include \
            -DSDL3_DIR=$SDL3_PATH/lib/cmake/SDL3 \
            -S src/armsx2/app/src/main/cpp

      - name: 🔨 Build
        run: |
          cmake --build build --config Release -j$(sysctl -n hw.logicalcpu)

      - name: 📦 Package IPA
        run: |
          mkdir -p output/Payload/BionicSX2.app
          find build -type f -perm +111 | head -10
          cd output && zip -r BionicSX2.ipa Payload/
          echo "IPA packaged ✅"

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BionicSX2-IPA
          path: output/BionicSX2.ipa
          retention-days: 7
